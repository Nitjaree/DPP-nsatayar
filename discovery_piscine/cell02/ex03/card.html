<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="card.css"

</head>
<body>

    <div class="profile-card">
        <!-- 1. Header ด้านบนสุด -->
        <div class="card-header">UPILL PROFILE CARD</div>
        
        <div class="card-body">
            <!-- 2. รูปโปรไฟล์ -->
            <img src="pill.jpg"Profile Picture" class="profile-img">
            
            <!-- 3. ชื่อ Login -->
            <div class="profile-login">nsatayar</div>
            
            <!-- 4. คำอธิบาย 2-3 คำ -->
            <div class="profile-desc">Head Destroyer Lab</div>
            
            <!-- 5. ตารางล่องหนสำหรับจัดเรียงข้อมูล -->
            <table class="info-table">
                <tr>
                    <td class="label">Email</td>
                    <td class="value">nsatayarak@gmail.com</td>
                </tr>
                <tr>
                    <td class="label">Location</td>
                    <td class="value">Bangkok 42, Thailand</td>
                </tr>
                <tr>
                    <td class="label">Status</td>
                    <td class="value">Single</td>
                </tr>
            </table>
            
            <!-- 6. ไอคอนโซเชียลเน็ตเวิร์กเรียงกัน -->
            <div class="social-links">
                <a class="social-icon" href="https://www.facebook.com/nitjaree.satayarak/"><img src="facebook.png" alt="Facebook"></a>
                <!-- <a class="social-icon" href="#"><img src="linkedin.png" alt="LinkedIn"></a>
                <a class="social-icon" href="#"><img src="twitter.png" alt="Twitter"></a> -->
                <a class="social-icon" href="https://www.instagram.com/nitjareesatayarak/"><img src="instagram.png" alt="Instagram"></a>
            </div>
            
            <!-- 7. ปุ่มกด Contact ด้านล่างสุด -->
            <a href="mailto:nsatayarak@gmail.com" class="contact-btn">Contact</a>
        </div>
    </div>

</body>
</html>
