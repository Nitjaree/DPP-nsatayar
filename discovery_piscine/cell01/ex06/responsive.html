<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Web</title>
    <style>
        body {
            margin: 0px;
            padding: 0px;
            height: 100%;
        }
        table {
            margin: 0;
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 0px solid black;
            padding: 0px;
            text-align: left;
            width: 50%;
            align-items: center;
            font-size: 3vw;
        }
        th {
            background-color: darkblue;
        }   
    </style>
</head>
<body>
    <table style="height: 100vh;">
        <tr>
            <td style="background-color: darkblue; color: yellow;">Hey Boy</td>
            <td style="background-color: lightblue; color: red;">Hi Girl</td>
        </tr>
    </table>
</body> 
</html>
