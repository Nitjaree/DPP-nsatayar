<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basics</title>
    <style>
      .image-container {
        display: grid;
        grid-template-columns: repeat(3, 1fr); /* แบ่งเป็น 3 คอลัมน์เท่าๆ กัน */
        gap: 16px; /* ระยะห่างระหว่างรูป */
      }
      .image-container img {
        width: 100%;
        height: 200px; /* กำหนดความสูงเท่ากัน */
        object-fit: cover; /* ตัดส่วนเกินไม่ให้รูปยืดเสียสัดส่วน */
        border-radius: 8px;
      }
    
      /* Three image containers (use 25% for four, and 50% for two, etc) */
    .column {
      float: left;
      width: 46%;
      padding: 10px;
    }

    /* Clear floats after image containers */
    .row::after {
      content: "";
      clear: both;
      display: table;
    }
    body {
        background-color: pink;
    }
    h1 {
        text-align: center;
        background-color: pink;
        color: white;
        font-size: 50px;
    }
    </style>
</head>
<body>
    <h1>Piscine Web</h1>
    <div class="row">
    <div class="column">
        <a href="https://shopee.co.th/"><img src=".\Shopee.png" alt="Shopee Logo" style="width:100%"></a>
    </div>
    <div class="column">
        <a href="https://www.lazada.co.th/"><img src=".\lazada-seeklogo.png" alt="Lazada Logo" style="width:100%; height:430px;"></a>
    </div>
    </div>
</body>
<footer class="site-footer">
  <p>© wil 2026</p>
</footer>
    
</html>
