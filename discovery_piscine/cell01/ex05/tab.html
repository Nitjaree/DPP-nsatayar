<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
            width: 50%;
            height: 100px;
            align-items: center;
        }
        th {
            background-color: darkblue;
        }
    </style>
</head>
<body>
    <table >
        <tr>
            <td style="background-color: darkblue; color: yellow;">Hey Boy</td>
            <td style="background-color: lightblue; color: red;">Hi Girl</td>
        </tr>
    </table>
</body>
</html>
